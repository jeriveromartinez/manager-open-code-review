swagger: "2.0"
info:
  title: Orders API
  version: 1.0.0
basePath: /v1
schemes:
  - https
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          type: string
      responses:
        "200":
          description: Orders
          schema:
            type: array
            items:
              $ref: "#/definitions/Order"
definitions:
  Order:
    type: object
    required:
      - id
    properties:
      id:
        type: integer
      total:
        type: number
      customer:
        $ref: "#/definitions/Customer"
  Customer:
    type: object
    properties:
      name:
        type: string
