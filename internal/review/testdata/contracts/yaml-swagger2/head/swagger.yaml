swagger: "2.0"
info:
  title: Orders API
  version: 2.0.0
basePath: /v1
schemes:
  - https
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: true
          type: string
      responses:
        "200":
          description: Orders
          schema:
            type: array
            items:
              $ref: "#/definitions/Order"
definitions:
  Order:
    type: object
    required:
      - id
      - currency
    properties:
      id:
        type: string
      total:
        type: number
      currency:
        type: string
      customer:
        $ref: "#/definitions/Customer"
