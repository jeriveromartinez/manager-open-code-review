openapi: 3.0.3
info:
  title: Status Codes API
  version: 1.1.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        200:
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        404:
          description: Not found
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - available
            - sold
        tag:
          type: string
