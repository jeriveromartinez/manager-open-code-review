---
openapi: 3.0.3
info:
  title: Anchors API
  version: &version 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /items:
    get:
      operationId: listItems
      responses:
        "200":
          description: ok
components:
  schemas:
    Item: &item
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        name:
          type: string
    ItemAlias: *item
