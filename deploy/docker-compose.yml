services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: qa_control_center
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_control_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backup programado con retención. Vive fuera de la app a propósito: usa
  # pg_dump contra el servidor, así que no necesita QA_MASTER_KEY ni puede
  # descifrar nada de lo que copia.
  backup:
    image: postgres:17
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QA_DATABASE_URL: ${QA_DATABASE_URL}
      QA_BACKUP_RETENTION: ${QA_BACKUP_RETENTION:-7}
    volumes:
      - backups-data:/backups
      # Los scripts viven en el repo, así que se montan en solo lectura.
      - ./backup.sh:/scripts/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    # Un backup diario a las 03:00 UTC. El bucle duerme hasta la siguiente
    # ventana en vez de confiar en cron, que la imagen no trae.
    command:
      - |
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "tomorrow 03:00" +%s)
          sleep $$((next - now))
          /bin/sh /scripts/backup.sh /backups || echo "backup failed, retrying at the next window" >&2
        done

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: qa-control-center:local
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    # La app necesita QA_MASTER_KEY y QA_WORKER_KEY (ambas en .env).
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # El túnel vive en la red del compose y resuelve la app por DNS (`app:8080`).
  # Con `network_mode: service:app` el túnel hereda el network namespace de
  # `app`, así que recrear o reiniciar la app lo deja apuntando a un namespace
  # muerto y el dominio público devuelve 502 hasta recrearlo a mano.
  # Es opcional: sin el perfil `tunnel` no se levanta.
  # En Cloudflare, el ingress del túnel debe apuntar a http://app:8080.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    # El token viaja por entorno y no por argv, así no aparece en `docker
    # inspect`. Sin token cloudflared falla al arrancar con un error explícito.
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    ports:
      # La imagen es distroless: no hay sh, wget ni curl, así que el contenedor
      # no puede comprobarse a sí mismo. Se publica el endpoint de métricas en
      # loopback para que el monitor externo consulte /ready: 200 con al menos
      # una conexión al edge, 503 mientras reconecta. Así un 502 público con
      # /ready en 503 señala al túnel y con /ready en 200 señala a la app.
      - "127.0.0.1:2000:2000"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    image: qa-control-center-worker:local
    command: ["worker"]
    restart: unless-stopped
    # Sin env_file: el worker nunca debe recibir QA_MASTER_KEY.
    environment:
      QA_DATABASE_URL: ${QA_DATABASE_URL}
      QA_PUBLIC_URL: ${QA_PUBLIC_URL}
      QA_WORKER_KEY: ${QA_WORKER_KEY}
      QA_REVIEW_CONCURRENCY: ${QA_REVIEW_CONCURRENCY:-2}
      QA_REVIEW_AGENT_STEPS: ${QA_REVIEW_AGENT_STEPS:-40}
      QA_REVIEW_TIMEOUT: ${QA_REVIEW_TIMEOUT:-20m}
      QA_REVIEW_STALE_AFTER: ${QA_REVIEW_STALE_AFTER:-45m}
      QA_LLM_HEALTH_INTERVAL: ${QA_LLM_HEALTH_INTERVAL:-30m}
      QA_WORKER_HEALTH_ADDR: ${QA_WORKER_HEALTH_ADDR:-:9090}
      QA_WORKER_QUEUE_STALE_AFTER: ${QA_WORKER_QUEUE_STALE_AFTER:-10m}
      QA_WORKSPACE_DIR: ${QA_WORKSPACE_DIR:-/tmp/qa}
      QA_OCR_BIN: ${QA_OCR_BIN:-ocr}
      QA_OPENCODE_BIN: ${QA_OPENCODE_BIN:-opencode}
      QA_GIT_BASE_URL: ${QA_GIT_BASE_URL:-https://github.com}
      QA_FETCH_DEPTH_MAX: ${QA_FETCH_DEPTH_MAX:-500}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      # Auth de opencode por perfil, persistida dentro del worker.
      - opencode-data:/home/qa/.opencode

volumes:
  postgres-data:
  opencode-data:
  backups-data:
