services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # `unless-stopped` solo reinicia un contenedor que sigue existiendo: si se
    # elimina (docker rm -f, docker compose down o una limpieza externa) no lo
    # recrea, y el volumen `postgres-data` queda huérfano hasta el próximo
    # `up`. Los datos sobreviven; el contenedor no.
    #
    # No añadas mem_limit/memswap_limit a este servicio: un límite demasiado
    # bajo puede provocar justo el OOM que intentas evitar, y matar PostgreSQL
    # por OOM es peor que dejar decidir al kernel con una visión global. La
    # protección de memoria se aplica en el host (cgroups/systemd slices,
    # reserva para el kernel y `shared_buffers` ajustado a la máquina), y
    # PostgreSQL no debe compartir host con vecinos pesados sin límite.
    environment:
      POSTGRES_DB: qa_control_center
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_control_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backup programado con retención. Vive fuera de la app a propósito: usa
  # pg_dump contra el servidor, así que no necesita QA_MASTER_KEY ni puede
  # descifrar nada de lo que copia. La retención es el ajuste del panel
  # backup_retention; el script la lee de app_settings en cada ejecución.
  backup:
    image: postgres:17
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QA_DATABASE_URL: ${QA_DATABASE_URL}
    volumes:
      - backups-data:/backups
      # Los scripts viven en el repo, así que se montan en solo lectura.
      - ./backup.sh:/scripts/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    # Un backup diario a las 03:00 UTC. El bucle duerme hasta la siguiente
    # ventana en vez de confiar en cron, que la imagen no trae.
    command:
      - |
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "tomorrow 03:00" +%s)
          sleep $$((next - now))
          /bin/sh /scripts/backup.sh /backups || echo "backup failed, retrying at the next window" >&2
        done

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: qa-control-center:local
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    # La app necesita QA_MASTER_KEY y QA_WORKER_KEY (ambas en .env). El .env
    # solo lleva la cadena de conexión y las dos claves; el resto se edita en
    # Ajustes, incluida la URL pública que detecta el asistente de /setup.
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # La imagen app es debian-slim sin curl ni wget: el propio binario, que ya
    # está en la imagen, hace de cliente HTTP contra su loopback. `qa
    # healthcheck` sale con 1 en cualquier respuesta distinta de 200, y
    # /healthz devuelve 503 cuando PostgreSQL no responde: si la base
    # desaparece, el contenedor de la app queda unhealthy.
    healthcheck:
      test: ["CMD", "/usr/local/bin/qa", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # El túnel vive en la red del compose y resuelve la app por DNS (`app:8080`).
  # Con `network_mode: service:app` el túnel hereda el network namespace de
  # `app`, así que recrear o reiniciar la app lo deja apuntando a un namespace
  # muerto y el dominio público devuelve 502 hasta recrearlo a mano.
  # Es opcional: sin el perfil `tunnel` no se levanta.
  # En Cloudflare, el ingress del túnel debe apuntar a http://app:8080.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    # El token viaja por entorno y no por argv, así no aparece en `docker
    # inspect`. Sin token cloudflared falla al arrancar con un error explícito.
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    ports:
      # La imagen es distroless: no hay sh, wget ni curl, así que el contenedor
      # no puede comprobarse a sí mismo. Se publica el endpoint de métricas en
      # loopback para que el monitor externo consulte /ready: 200 con al menos
      # una conexión al edge, 503 mientras reconecta. Así un 502 público con
      # /ready en 503 señala al túnel y con /ready en 200 señala a la app.
      - "127.0.0.1:2000:2000"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    image: qa-control-center-worker:local
    command: ["worker"]
    restart: unless-stopped
    # Recreating the worker must let in-flight reviews drain: SIGTERM starts a
    # 45s soft stop and then up to 15s more to requeue whatever was cancelled.
    # Docker's 10s default would SIGKILL the process halfway through.
    stop_grace_period: 90s
    # Docker's default seccomp profile blocks CLONE_NEWUSER, which bubblewrap
    # needs for the base–head differential evidence (#230). The container keeps
    # running as uid 10001 and only the differential executor uses bwrap.
    security_opt:
      - seccomp=unconfined
    # Sin env_file: el worker nunca debe recibir QA_MASTER_KEY.
    environment:
      QA_DATABASE_URL: ${QA_DATABASE_URL}
      QA_WORKER_KEY: ${QA_WORKER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      # service_started no espera al migrate, y el worker lee app_settings al
      # arrancar: en una base nueva moriría con «relation app_settings does not
      # exist». El healthcheck de la app solo responde con la base y las
      # migraciones listas.
      app:
        condition: service_healthy
    volumes:
      # Auth de opencode por perfil, persistida dentro del worker.
      - opencode-data:/home/qa/.opencode
    # node:24-trixie-slim no trae curl ni wget, pero sí node: fetch del propio
    # /healthz es el único cliente HTTP disponible en la imagen.
    # /healthz ya devuelve 503 cuando la base o un binario fallan.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:9090/healthz',{signal:AbortSignal.timeout(8000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Las alertas viven fuera del worker a propósito: un proceso muerto no puede
  # avisar de que está muerto. Sondea /healthz y /metrics, mantiene estado
  # entre ciclos y no necesita claves. Su configuración (URL del worker,
  # intervalos y webhook) vive en app_settings: si la base no responde al
  # arrancar, usa los defaults y avisa en el log en vez de no arrancar.
  monitor:
    image: qa-control-center:local
    profiles: ["monitor"]
    restart: unless-stopped
    command: ["monitor"]
    environment:
      QA_DATABASE_URL: ${QA_DATABASE_URL}
    depends_on:
      worker:
        condition: service_started

volumes:
  postgres-data:
  opencode-data:
  backups-data:
