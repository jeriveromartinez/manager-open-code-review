services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: qa_control_center
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_control_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: qa-control-center:local
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    # La app necesita QA_MASTER_KEY y QA_WORKER_KEY (ambas en .env).
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    image: qa-control-center-worker:local
    command: ["worker"]
    restart: unless-stopped
    # Sin env_file: el worker nunca debe recibir QA_MASTER_KEY.
    environment:
      QA_DATABASE_URL: ${QA_DATABASE_URL}
      QA_PUBLIC_URL: ${QA_PUBLIC_URL}
      QA_WORKER_KEY: ${QA_WORKER_KEY}
      QA_REVIEW_CONCURRENCY: ${QA_REVIEW_CONCURRENCY:-2}
      QA_REVIEW_TIMEOUT: ${QA_REVIEW_TIMEOUT:-20m}
      QA_REVIEW_STALE_AFTER: ${QA_REVIEW_STALE_AFTER:-45m}
      QA_WORKSPACE_DIR: ${QA_WORKSPACE_DIR:-/tmp/qa}
      QA_OCR_BIN: ${QA_OCR_BIN:-ocr}
      QA_OPENCODE_BIN: ${QA_OPENCODE_BIN:-opencode}
      QA_GIT_BASE_URL: ${QA_GIT_BASE_URL:-https://github.com}
      QA_FETCH_DEPTH_MAX: ${QA_FETCH_DEPTH_MAX:-500}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      # Auth de opencode por perfil, persistida dentro del worker.
      - opencode-data:/home/qa/.opencode

volumes:
  postgres-data:
  opencode-data:
