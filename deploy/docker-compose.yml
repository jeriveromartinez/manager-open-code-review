x-app-image: &app-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: qa-control-center:local

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: qa_control_center
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_control_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *app-image
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app-image
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      # Reservado para Fase 2 (auth de opencode por perfil).
      - opencode-data:/home/qa/.opencode

volumes:
  postgres-data:
  opencode-data:
